[workspace]
members = [".", "crates/*"]
resolver = "2"

[profile.bench]
debug = true

[package]
name = "enrede"
version = "0.2.1"
edition = "2024"
keywords = ["encoding", "string", "algorithm", "utf8"]
categories = ["encoding", "algorithms"]
description = "An easy-to-use string encoding library, providing an interface similar to str/String."
license = "MIT OR Apache-2.0"
repository = "https://github.com/CraftSpider/enrede"

[features]
defaults = ["std", "all_encodings"]
# Allow dependency on `std`
std = ["enrede-core/std"]
# Allow dependency on `alloc`
alloc = ["enrede-core/alloc"]
# Add support for using encodings as `Distribution` to generate characters valid for that encoding.
rand = ["enrede-core/rand"]
# Add support for serializing/deserializing types
serde = ["enrede-core/serde"]
# Add re-exports for macros from the proc-macro crate
macros = ["dep:enrede-proc"]

# All encodings. Note: even when disabled, UTF encodings are always supported, as they're built into Rust.
all_encodings = ["win", "iso", "mac", "jis", "ascii"]

win = ["win1251", "win1252"]
win1251 = ["enrede-core/win1251"]
win1252 = ["enrede-core/win1252"]

iso = ["iso8859_1", "iso8859_2", "iso8859_3", "iso8859_4", "iso8859_5", "iso8859_6", "iso8859_7", "iso8859_8", "iso8859_9", "iso8859_10", "iso8859_11", "iso8859_13", "iso8859_14", "iso8859_15", "iso8859_16"]
iso8859_1 = ["enrede-core/iso8859_1"]
iso8859_2 = ["enrede-core/iso8859_2"]
iso8859_3 = ["enrede-core/iso8859_3"]
iso8859_4 = ["enrede-core/iso8859_4"]
iso8859_5 = ["enrede-core/iso8859_5"]
iso8859_6 = ["enrede-core/iso8859_6"]
iso8859_7 = ["enrede-core/iso8859_7"]
iso8859_8 = ["enrede-core/iso8859_8"]
iso8859_9 = ["enrede-core/iso8859_9"]
iso8859_10 = ["enrede-core/iso8859_10"]
iso8859_11 = ["enrede-core/iso8859_11"]
iso8859_13 = ["enrede-core/iso8859_13"]
iso8859_14 = ["enrede-core/iso8859_14"]
iso8859_15 = ["enrede-core/iso8859_15"]
iso8859_16 = ["enrede-core/iso8859_16"]

mac = ["mac_roman"]
mac_roman = ["enrede-core/mac_roman"]

jis = ["shiftjis", "jisx0201", "jisx0208"]
# Based on other encodings, so depends on their implementations
shiftjis = ["enrede-core/shiftjis"]
jisx0201 = ["enrede-core/jisx0201"]
jisx0208 = ["enrede-core/jisx0208"]

ascii = ["enrede-core/ascii"]

[dependencies]
enrede-core = { version = "0.1", path = "crates/enrede-core", default-features = false }
enrede-proc = { version = "0.1", path = "crates/enrede-proc", optional = true }

[dev-dependencies]
criterion = "0.5"
rand = "0.9"
byte-unit = "5.1"

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15", features = ["criterion", "flamegraph"] }

[[bench]]
name = "encoding"
harness = false
required-features = ["alloc", "rand"]

[package.metadata.docs.rs]
all-features = true

[package]
name = "enrede-proc"
version = "0.1.0"
edition = "2024"
description = "Proc macros for the enrede string encoding library."
license = "MIT OR Apache-2.0"
repository = "https://github.com/CraftSpider/enrede"

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = "3.0"
proc-macro2 = "1.0"
quote = "1.0"
enrede-core = { version = "0.1", path = "../enrede-core", default-features = false, features = ["alloc", "all_encodings"] }

[dev-dependencies]
enrede = { version = "0.2.1", path = "../.." }
